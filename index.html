    <script data-goatcounter="https://excc.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script>
      (function () {
        function gc(name) {
          if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: name, event: true });
        }
        document.addEventListener("click", function (e) {
          var el = e.target && e.target.closest ? e.target.closest("[data-gc]") : null;
          if (el) gc(el.getAttribute("data-gc"));
        });
        document.addEventListener("play", function (e) {
          var t = e.target;
          if (t && t.getAttribute && t.getAttribute("data-gc") && !t.__gcPlayed) { t.__gcPlayed = true; gc(t.getAttribute("data-gc")); }
        }, true);
      })();
    </script>
